name: Robô de passagens

on:
  schedule:
    # O GitHub às vezes atrasa ou pula execuções agendadas, então há horários
    # reserva. O robô só consulta na primeira que rodar no dia.
    - cron: "17 11 * * *"   # 08:17 (horário de Brasília)
    - cron: "47 12 * * *"   # 09:47 (reserva)
    - cron: "17 15 * * *"   # 12:17 (reserva)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-passagens

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Consultar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo.py
      - name: Salvar histórico
        if: always()   # salva mesmo que o envio ao Telegram tenha falhado
        run: |
          git config user.name "robo-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv
          git diff --cached --quiet || git commit -m "Preços de passagens $(date -u +%F)"
          git pull --rebase && git push
