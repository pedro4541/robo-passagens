name: Robô de passagens

on:
  schedule:
    # O GitHub atrasa (às vezes horas) as execuções agendadas. Por isso ele
    # chama o robô de hora em hora; o robô só consulta na primeira chamada
    # a partir das 05:00 (Brasília) e ignora as demais do dia.
    - cron: "23 * * * *"
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  repository_dispatch:       # chamado pelo despertador externo (cron-job.org)
    types: [consulta-diaria]

permissions:
  contents: write

concurrency:
  group: robo-passagens

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Consultar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo.py
      - name: Salvar histórico
        if: always()   # salva mesmo que o envio ao Telegram tenha falhado
        run: |
          git config user.name "robo-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv
          git diff --cached --quiet || git commit -m "Preços de passagens $(date -u +%F)"
          git pull --rebase && git push
