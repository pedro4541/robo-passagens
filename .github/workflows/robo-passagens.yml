name: Robô de passagens

on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-passagens

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo.py
      - name: Salvar histórico
        run: |
          git config user.name "robo-passagens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv
          git diff --cached --quiet || git commit -m "Preços de passagens $(date -u +%F)"
          git pull --rebase && git push
